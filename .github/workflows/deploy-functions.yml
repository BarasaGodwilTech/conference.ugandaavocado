name: Deploy Firebase Functions

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.firebaserc'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: functions
        run: npm install

      - name: Install Firebase CLI
        run: npm i -g firebase-tools

      - name: Deploy functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-key.json
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          FIREBASE_SERVICE_ACCOUNT_KEY_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY_B64 }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_KEY_B64" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_KEY_B64" | base64 -d > "$GOOGLE_APPLICATION_CREDENTIALS"
          else
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_KEY" > "$GOOGLE_APPLICATION_CREDENTIALS"
          fi
          export GOOGLE_APPLICATION_CREDENTIALS="$GOOGLE_APPLICATION_CREDENTIALS"
          node -e "const fs=require('fs'); JSON.parse(fs.readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS,'utf8')); console.log('Service account JSON: OK');"
          firebase deploy --only functions --project avocado-conference --non-interactive
