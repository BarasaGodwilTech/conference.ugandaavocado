<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're Offline - Uganda Avocado Conference 2026</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <link rel="icon" type="image/x-icon" href="/favicons/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicons/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicons/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/favicons/android-chrome-512x512.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicons/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicons/favicon-192x192.png">
    <link rel="mask-icon" href="/favicons/safari-pinned-tab.svg" color="#5bbad5">

    <style>
        .offline-page {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 120px 0 60px;
        }
        .offline-card {
            background: var(--white);
            border-radius: var(--border-radius-xl);
            box-shadow: var(--box-shadow-lg);
            max-width: 760px;
            width: calc(100% - 32px);
            padding: 48px 28px;
            text-align: center;
            margin: 0 auto;
        }
        .offline-logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: inherit;
            margin-bottom: 18px;
        }
        .offline-logo img {
            height: 44px;
            width: auto;
        }
        .offline-icon {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: var(--gradient-avocado);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px auto 18px;
            color: var(--white);
            font-size: 2.2rem;
        }
        .offline-title {
            font-size: 1.6rem;
            color: var(--avocado-green-dark);
            margin-bottom: 10px;
        }
        .offline-desc {
            color: var(--dark-gray);
            max-width: 560px;
            margin: 0 auto 26px;
        }
        .offline-actions {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .offline-actions a,
        .offline-actions button {
            text-decoration: none;
            border: 0;
            cursor: pointer;
        }
        .offline-actions .btn-outline {
            border: 2px solid var(--avocado-green);
            color: var(--avocado-green);
            background: transparent;
            padding: 12px 18px;
            border-radius: 14px;
            font-weight: 700;
            transition: all var(--transition-normal);
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .offline-actions .btn-outline:hover {
            transform: translateY(-2px);
            box-shadow: var(--box-shadow-md);
        }
        .offline-actions .btn-primary {
            padding: 12px 18px;
            border-radius: 14px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .status-line {
            margin-top: 20px;
            color: var(--medium-gray);
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <main class="offline-page">
        <section class="offline-card">
            <a class="offline-logo" href="/">
                <img src="images/logo.png" alt="Uganda Avocado">
                <span class="year"></span>
            </a>

            <div class="offline-icon"><i class="fa-solid fa-wifi"></i></div>
            <h1 class="offline-title">You’re offline</h1>
            <p class="offline-desc">It looks like your internet connection is unavailable. Please reconnect and try again.</p>

            <div class="offline-actions">
                <button class="btn btn-primary" id="retryBtn"><i class="fa-solid fa-rotate-right"></i> Retry</button>
                <a class="btn-outline" href="/"><i class="fa-solid fa-house"></i> Home</a>
                <a class="btn-outline" href="/registration.html"><i class="fa-solid fa-id-card"></i> Registration</a>
            </div>

            <div class="status-line" id="statusLine"></div>
        </section>
    </main>

    <script>
        (function () {
            var statusLine = document.getElementById('statusLine');
            function updateStatus() {
                if (!statusLine) return;
                statusLine.textContent = navigator.onLine ? 'Connection restored. You can go back.' : 'Status: Offline';
            }
            updateStatus();
            window.addEventListener('online', updateStatus);
            window.addEventListener('offline', updateStatus);

            var retryBtn = document.getElementById('retryBtn');
            if (retryBtn) {
                retryBtn.addEventListener('click', function () {
                    if (navigator.onLine) {
                        window.location.href = '/';
                        return;
                    }
                    window.location.reload();
                });
            }
        })();
    </script>
</body>
</html>
